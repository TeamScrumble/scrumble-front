name: React 애플리케이션 빌드 및 도커 배포

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy front'
        required: true
        type: choice
        options:
        - manual-deploy
        - total-deploy

jobs:
    node-build:
        runs-on: build
        if: ${{ inputs.deploy_target == 'total-deploy' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        steps:
        - name: 소스 코드 체크아웃
          uses: actions/checkout@v4
    
        - name: Node.js 20 설정
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
    
        - name: npm 캐시 복원
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-
    
        - name: 의존성 설치
          run: npm i
    
        - name: React 앱 빌드
          run: npm run build
    
        - name: 빌드 결과물 업로드
          uses: actions/upload-artifact@v4
          with:
            name: node-build
            path: dist

    docker-build:
        runs-on: build
        needs: node-build
        if: ${{ inputs.deploy_target == 'total-deploy' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') }}
        steps:
        - name: 소스 코드 체크아웃
          uses: actions/checkout@v4

        - name: 빌드 결과물 다운로드
          uses: actions/download-artifact@v4
          with:
            name: node-build
            path: dist
        - name: Docker Registry 로그인
          run: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_HOST }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

        - name: Docker 이미지 빌드
          run: docker build --platform linux/arm64 -t ${{ secrets.REGISTRY_HOST }}/react-app:latest . --build-arg VITE_API_BASE_URL=https://scrumble.kro.kr/api
        
        - name: 도커 이미지 푸시
          run: docker push ${{ secrets.REGISTRY_HOST }}/react-app:latest

        - name: 도커 이미지 업로드
          uses: actions/upload-artifact@v4
          with:
            name: react-app-image
            path: react-app.tar
            
        - name: Docker 로그아웃
          run: docker logout ${{ secrets.REGISTRY_HOST }}    

    docker-deploy-manual:
        runs-on: deploy
        env:
           DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}
        if: inputs.deploy_target == 'manual-deploy'
        steps:
        - name: 도커 이미지 가져오기
          run: docker pull localhost:5000/react-app:latest

        - name: 기존 컨테이너 중지 및 삭제 (있을 경우)
          run: |
            docker stop react-app || true
            docker rm react-app || true

        - name: 새 컨테이너 실행
          run: |
            docker run -d \
            --name react-app \
            --network "$DOCKER_NETWORK" \
            -p 3111:80 \
            localhost:5000/react-app:latest
            

    docker-deploy-total:
        runs-on: deploy
        env:
           DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}
        needs: docker-build
        if: inputs.deploy_target == 'total-deploy'
        steps:
        - name: 도커 이미지 가져오기
          run: docker pull localhost:5000/react-app:latest

        - name: 기존 컨테이너 중지 및 삭제 (있을 경우)
          run: |
            docker stop react-app || true
            docker rm react-app || true

        - name: 새 컨테이너 실행
          run: |
            docker run -d \
            --name react-app \
            --network "$DOCKER_NETWORK" \
            -p 3111:80 \
            localhost:5000/react-app:latest
            
